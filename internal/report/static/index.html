<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>report-designer (minimal)</title>
<style>
body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
#left { width: 42%; display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; }
#ir { flex: 1; font-family: monospace; font-size: 12px; }
#bar { padding: 6px 0; display: flex; gap: 8px; align-items: center; }
#right { flex: 1; border-left: 1px solid #ccc; }
#preview { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="left">
  <div id="bar">
    <button id="btn-sample" type="button">Load sample</button>
    <button id="btn-render" type="button">Render preview</button>
    <button id="btn-pdf" type="button">Export PDF</button>
    <label>Import .frx: <input id="file-frx" type="file" accept=".frx"></label>
  </div>
  <textarea id="ir" spellcheck="false" placeholder="IR JSON appears here"></textarea>
</div>
<div id="right">
  <iframe id="preview" title="preview" sandbox="allow-same-origin"></iframe>
</div>
<script src="/static/app.js"></script>
</body>
</html>
